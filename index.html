<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coming Home">
  <title>Coming Home</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Satellitenkarte"></div>

  <header class="topbar">
    <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="Positionsquelle">
      <button id="modeGps" class="active" role="tab" aria-selected="true">GPS</button>
      <button id="modeSim" role="tab" aria-selected="false">Simulation</button>
    </div>
    <button id="shareBtn" class="icon-btn" title="Position teilen" aria-label="Position teilen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="18" cy="5" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8.3 10.7 7.4-4.3M8.3 13.3l7.4 4.3" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button id="topToggle" class="icon-btn" title="Obere Leiste ein-/ausblenden" aria-label="Obere Leiste ein- oder ausblenden" aria-pressed="true" aria-controls="modeSwitch simForm">
      <svg class="ico-open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="ico-close" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="fitBtn" class="icon-btn" title="Beide Punkte zeigen" aria-label="Beide Punkte zeigen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <form id="simForm" class="sim-panel hidden" autocomplete="off">
    <div class="sim-row">
      <input id="simInput" type="search" placeholder="Adresse oder Position" enterkeyhint="search" aria-label="Adresse für Simulation">
      <button type="submit">Suchen</button>
    </div>
    <ul id="simResults" class="sim-results"></ul>
    <p class="sim-hint">Tipp: Geteilte Nachricht einfach komplett einfügen – oder direkt auf die Karte tippen.</p>
  </form>

  <section class="panel" aria-live="polite">
    <div class="compass" id="compass">
      <div class="dial" id="dial">
        <span class="cardinal n">N</span>
        <span class="cardinal e">O</span>
        <span class="cardinal s">S</span>
        <span class="cardinal w">W</span>
        <div class="ticks"></div>
      </div>
      <div class="arrow" id="arrow">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="50,6 66,58 50,49 34,58" fill="#ff5a3c" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="50" cy="50" r="5" fill="#fff"/>
        </svg>
      </div>
    </div>
    <div class="readout">
      <div class="distance" id="distance">–</div>
      <div class="bearing" id="bearing">Warte auf Position …</div>
      <div class="status" id="status"></div>
      <button id="compassBtn" class="compass-btn hidden">Kompass aktivieren</button>
    </div>
  </section>

  <div id="gallery" class="gallery hidden" role="dialog" aria-modal="true" aria-label="Bildergalerie Zuhause">
    <div class="gallery-head">
      <h2 class="gallery-title">Zuhause</h2>
      <button id="galleryClose" class="icon-btn" aria-label="Galerie schließen" title="Schließen">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="gallery-track" id="galleryTrack"></div>
    <div class="gallery-foot">
      <button id="galleryPrev" class="icon-btn" aria-label="Vorheriges Bild">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="galleryCount" class="gallery-count"></span>
      <button id="galleryNext" class="icon-btn" aria-label="Nächstes Bild">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <div id="shareSheet" class="share-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="share-box">
      <h2 id="shareTitle">Position teilen</h2>
      <pre id="shareText" class="share-text"></pre>
      <a id="shareWhatsApp" class="share-action wa" href="#" target="_blank" rel="noopener">Per WhatsApp senden</a>
      <button id="shareNative" class="share-action" type="button">Andere App …</button>
      <button id="shareCopy" class="share-action" type="button">Text kopieren</button>
      <button id="shareCancel" class="share-action ghost" type="button">Schließen</button>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
